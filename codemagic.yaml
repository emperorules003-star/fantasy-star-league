workflows:
  android:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 18.17.0
    cache:
      cache_paths:
        - node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build web app
        script: |
          npm run build

      - name: Install Capacitor
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        script: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Fantasy Star League" "com.fantasystar.league" --web-dir=dist
          fi

      - name: Add Android platform
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
